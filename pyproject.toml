[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-strategy"
version = "1.0.0"
description = "Stock selection, portfolio weighting and backtesting on the S&P 500 and STOXX Europe 600."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "statsmodels>=0.13.5",
    "yfinance>=0.2.54",
    "pandarallel>=1.6.4",
    "lxml>=4.9",
    "openpyxl>=3.0",
    "selenium>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
equity-strategy = "equity_strategy.cli:main"

[tool.setuptools.packages.find]
include = ["equity_strategy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy", "venv", "env"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
